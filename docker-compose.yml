services:
  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - MODEL_PATH=/app/model
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_SECRET=${AI_API_SECRET}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_API_SECRET=${IMAGE_API_SECRET}
    volumes:
      - ./ai-service:/app

  db-healthcheck:
    build: ./db-healthcheck
    environment:
      - MONGO_URI_WRITE=mongodb://mongo:27017/mydb
      - MONGO_URI_READ=mongodb://mongo:27017/mydb
    depends_on:
      - mongo
    ports:
      - "9990:9990"
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"  
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev"

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI_WRITE=mongodb://mongo:27017/lung_app
      - MONGO_URI_READ=mongodb://mongo:27017/lung_app
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_SECRET=${AI_API_SECRET}
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_API_SECRET=${IMAGE_API_SECRET}
    depends_on:
      - mongo
      - redis


  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=lung_app

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
